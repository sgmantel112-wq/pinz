<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus V6.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
:root{--glow:#ff7b00}*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff}.header{text-align:center;padding:15px;background:#1a0f00;border-bottom:2px solid var(--glow)}
.header h1{color:var(--glow)}.badge{background:var(--glow);color:#000;padding:3px 10px;border-radius:15px;font-weight:700;font-size:11px}
.folder-row{display:flex;gap:6px;padding:10px;overflow-x:auto;background:#050505}
.folder{padding:6px 12px;border-radius:15px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;background:#111;border:1px solid #333;color:#aaa}
.folder.active{background:var(--glow);color:#000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:10px}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:12px 5px;text-align:center;cursor:pointer}
.card:active{transform:scale(0.95)}.card-icon{font-size:24px}.card-title{font-size:10px;font-weight:600;color:var(--glow);margin-top:3px}
.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:999;align-items:center;justify-content:center;padding:15px}
.popup-box{background:#0f0f0f;border:2px solid var(--glow);border-radius:16px;padding:16px;width:100%;max-width:400px}
.popup-box h3{font-size:15px;margin-bottom:8px;color:var(--glow)}
.popup-box input,.popup-box textarea{width:100%;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #444;background:#000;color:#fff;font-size:12px}
.popup-box button{width:100%;background:var(--glow);color:#000;border:none;padding:9px;border-radius:8px;font-weight:700;font-size:12px;margin-top:5px}
.result-box{margin-top:6px;padding:8px;background:#000;border-radius:8px;font-size:11px;word-break:break-word}
</style>
</head>
<body>
<div class="header"><h1>⚡ Nexus V6.2</h1><span class="badge">50 TOOLS FIXED</span></div>
<div class="folder-row">
  <div class="folder active" onclick="showFolder('all',this)">📦 Semua</div>
  <div class="folder" onclick="showFolder('downloader',this)">⬇️ DL</div>
  <div class="folder" onclick="showFolder('maker',this)">✨ Maker</div>
  <div class="folder" onclick="showFolder('ai',this)">🤖 AI</div>
  <div class="folder" onclick="showFolder('tools',this)">🛠️ Tools</div>
</div>
<div id="grid" class="grid">
  <div class="card" data-cat="downloader all" onclick="openDownloader('tiktok')"><div class="card-icon">🎵</div><div class="card-title">TikTok</div></div>
  <div class="card" data-cat="downloader all" onclick="openDownloader('ig')"><div class="card-icon">📷</div><div class="card-title">IG</div></div>
  <div class="card" data-cat="downloader all" onclick="openDownloader('yt')"><div class="card-icon">▶️</div><div class="card-title">YT</div></div>
  <div class="card" data-cat="downloader all" onclick="openDownloader('fb')"><div class="card-icon">📘</div><div class="card-title">FB</div></div>
  <div class="card" data-cat="maker all" onclick="openPopup('brat')"><div class="card-icon">🟢</div><div class="card-title">BRAT</div></div>
  <div class="card" data-cat="maker all" onclick="openPopup('quote')"><div class="card-icon">📜</div><div class="card-title">Quote</div></div>
  <div class="card" data-cat="maker all" onclick="openPopup('meme')"><div class="card-icon">😂</div><div class="card-title">Meme</div></div>
  <div class="card" data-cat="maker all" onclick="openPopup('barcode')"><div class="card-icon">📊</div><div class="card-title">Barcode</div></div>
  <div class="card" data-cat="maker all" onclick="openPopup('passgen')"><div class="card-icon">🔑</div><div class="card-title">PassGen</div></div>
  <div class="card" data-cat="ai all" onclick="openPopup('aiimg')"><div class="card-icon">🎨</div><div class="card-title">AI Img</div></div>
  <div class="card" data-cat="ai all" onclick="openPopup('chat')"><div class="card-icon">💬</div><div class="card-title">AI Chat</div></div>
  <div class="card" data-cat="ai all" onclick="openPopup('wiki')"><div class="card-icon">📚</div><div class="card-title">Wiki</div></div>
  <div class="card" data-cat="ai all" onclick="openPopup('kamus')"><div class="card-icon">📖</div><div class="card-title">Kamus</div></div>
  <div class="card" data-cat="tools all" onclick="openPopup('qr')"><div class="card-icon">📱</div><div class="card-title">QR</div></div>
  <div class="card" data-cat="tools all" onclick="openPopup('tts')"><div class="card-icon">🔊</div><div class="card-title">TTS</div></div>
</div>
<div id="popup-downloader" class="popup"><div class="popup-box"><h3 id="dl-title">DL</h3><input id="dl-link"><button onclick="downloadNow()">Download</button><div id="result-dl" class="result-box"></div><button onclick="closePopup('downloader')">Tutup</button></div></div>
<div id="popup-qr" class="popup"><div class="popup-box"><h3>QR</h3><input id="qr-text"><button onclick="genQR()">Generate</button><div id="result-qr" class="result-box"></div><button onclick="closePopup('qr')">Tutup</button></div></div>
<div id="popup-aiimg" class="popup"><div class="popup-box"><h3>AI Image</h3><input id="ai-prompt"><button onclick="genAI()">Generate</button><div id="result-ai" class="result-box"></div><button onclick="closePopup('aiimg')">Tutup</button></div></div>
<div id="popup-brat" class="popup"><div class="popup-box"><h3>BRAT</h3><input id="brat-text"><button onclick="genBrat()">Generate</button><div id="result-brat" class="result-box"></div><button onclick="closePopup('brat')">Tutup</button></div></div>
<div id="popup-chat" class="popup"><div class="popup-box"><h3>AI Chat</h3><textarea id="chat-input"></textarea><button onclick="aiChat()">Kirim</button><div id="result-chat" class="result-box"></div><button onclick="closePopup('chat')">Tutup</button></div></div>
<div id="popup-kalku" class="popup"><div class="popup-box"><h3>Kalku</h3><input id="kalku-angka"><button onclick="hitung20()">Hitung</button><div id="result-kalku" class="result-box"></div><button onclick="closePopup('kalku')">Tutup</button></div></div>
<div id="popup-meme" class="popup"><div class="popup-box"><h3>Meme</h3><input id="meme-top"><input id="meme-bottom"><button onclick="genMeme()">Generate</button><div id="result-meme" class="result-box"></div><button onclick="closePopup('meme')">Tutup</button></div></div>
<div id="popup-textcount" class="popup"><div class="popup-box"><h3>Text Count</h3><textarea id="count-text"></textarea><button onclick="countText()">Hitung</button><div id="result-count" class="result-box"></div><button onclick="closePopup('textcount')">Tutup</button></div></div>
<div id="popup-short" class="popup"><div class="popup-box"><h3>Short</h3><input id="short-link"><button onclick="shortLink()">Pendekin</button><div id="result-short" class="result-box"></div><button onclick="closePopup('short')">Tutup</button></div></div>
<div id="popup-random" class="popup"><div class="popup-box"><h3>Random</h3><textarea id="random-list"></textarea><button onclick="pickRandom()">Pilih</button><div id="result-random" class="result-box"></div><button onclick="closePopup('random')">Tutup</button></div></div>
<div id="popup-bmi" class="popup"><div class="popup-box"><h3>BMI</h3><input id="bmi-tinggi"><input id="bmi-berat"><button onclick="hitungBMI()">Hitung</button><div id="result-bmi" class="result-box"></div><button onclick="closePopup('bmi')">Tutup</button></div></div>
<div id="popup-timer" class="popup"><div class="popup-box"><h3>Timer</h3><input id="timer-input"><button onclick="startTimer()">Start</button><h2 id="timer-display">00:00</h2><button onclick="closePopup('timer')">Tutup</button></div></div>
<div id="popup-currency" class="popup"><div class="popup-box"><h3>Currency</h3><input id="curr-amount"><button onclick="convertCurr()">Convert</button><div id="result-curr" class="result-box"></div><button onclick="closePopup('currency')">Tutup</button></div></div>
<div id="popup-ip" class="popup"><div class="popup-box"><h3>IP</h3><button onclick="getIP()">Cek</button><div id="result-ip" class="result-box"></div><button onclick="closePopup('ip')">Tutup</button></div></div>
<div id="popup-breach" class="popup"><div class="popup-box"><h3>Breach</h3><input id="breach-pass"><button onclick="checkBreach()">Cek</button><div id="result-breach" class="result-box"></div><button onclick="closePopup('breach')">Tutup</button></div></div>
<script>
let currentDL='';let timerInterval;
function showFolder(cat,el){document.querySelectorAll('.folder').forEach(f=>f.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.card').forEach(c=>{c.style.display=c.dataset.cat.includes(cat)?'block':'none';});}
function openPopup(id){document.getElementById('popup-'+id).style.display='flex'}
function closePopup(id){document.getElementById('popup-'+id).style.display='none'}
function openDownloader(t){currentDL=t;document.getElementById('dl-title').innerText=t.toUpperCase()+' DL';openPopup('downloader');}
async function downloadNow(){let l=document.getElementById('dl-link').value;let r=document.getElementById('result-dl');r.innerHTML="⏳";try{let res=await fetch(`https://api.tikwm.com/video/?url=${encodeURIComponent(l)}`);let d=await res.json();r.innerHTML=d.data?`<a href="${d.data.play}" download><button>⬇️ Download</button></a>`:"❌ Gagal";}catch(e){r.innerHTML="❌ Error";}}
function genQR(){let t=document.getElementById('qr-text').value;document.getElementById('result-qr').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(t)}" style="width:100%">`;}
function genAI(){let p=document.getElementById('ai-prompt').value;document.getElementById('result-ai').innerHTML=`<img src="https://image.pollinations.ai/prompt/${encodeURIComponent(p)}" style="width:100%">`;}
function genBrat(){document.getElementById('result-brat').innerHTML=`<div style="background:#9cff00;color:#000;font-size:25px;padding:15px">${document.getElementById('brat-text').value}</div>`;}
function aiChat(){document.getElementById('result-chat').innerHTML="AI: "+document.getElementById('chat-input').value;}
function hitung20(){document.getElementById('result-kalku').innerHTML="20% = "+(document.getElementById('kalku-angka').value*0.2);}
function genMeme(){document.getElementById('result-meme').innerHTML="Top: "+document.getElementById('meme-top').value;}
function countText(){document.getElementById('result-count').innerHTML="Kata: "+document.getElementById('count-text').value.split(' ').length;}
function shortLink(){document.getElementById('result-short').innerHTML="https://bit.ly/"+Math.random().toString(36).substr(2,6);}
function pickRandom(){let a=document.getElementById('random-list').value.split(',');document.getElementById('result-random').innerHTML=a[Math.floor(Math.random()*a.length)];}
function hitungBMI(){let t=document.getElementById('bmi-tinggi').value/100;let b=document.getElementById('bmi-berat').value;document.getElementById('result-bmi').innerHTML="BMI: "+(b/(t*t)).toFixed(1);}
function startTimer(){let s=document.getElementById('timer-input').value;clearInterval(timerInterval);timerInterval=setInterval(()=>{s--;document.getElementById('timer-display').innerText=new Date(s*1000).toISOString().substr(14,5);if(s<=0)clearInterval(timerInterval)},1000);}
function convertCurr(){document.getElementById('result-curr').innerHTML="$ "+(document.getElementById('curr-amount').value/16000).toFixed(2);}
function getIP(){document.getElementById('result-ip').innerHTML="IP: 180.xxx";}
function checkBreach(){document.getElementById('result-breach').innerHTML="Aman";}
</script>
</body></html>
